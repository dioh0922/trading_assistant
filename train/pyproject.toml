[project]
name = "stock-ml"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "polars>=0.20",
    "pyarrow>=15.0",
    "lightgbm>=4.0",
    "scikit-learn>=1.4",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "typer>=0.9",
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
